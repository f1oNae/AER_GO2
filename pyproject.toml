[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "AER"
version = "0.1.0"
description = "Isaac Lab environments for AER."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Isaac Lab Project Developers" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab[rsl-rl]",
]

[project.entry-points."isaaclab.tasks"]
"AER" = "AER.tasks"

[project.optional-dependencies]
isaacsim = ["isaaclab[isaacsim]"]
ov = ["isaaclab[ov]"]
ovphysx = ["isaaclab[ovphysx]"]
ovrtx = ["isaaclab[ovrtx]"]

[dependency-groups]
dev = ["codespell>=2.4", "pre-commit>=4.2", "pytest>=8.3", "ruff>=0.11"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"

[tool.uv.build-backend]
module-name = "AER"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["AER"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "isaaclab",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-assets",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
isaaclab = ["isaaclab", "isaaclab_newton", "isaaclab_ov", "isaaclab_physx"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-tasks" = ["isaaclab_tasks"]
"isaaclab-assets" = ["isaaclab_assets"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/__init__.pyi" = ["F401", "F403"]
"scripts/**/*.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: test exercises isolated logic and does not launch the simulator",
    "integration: test drives the simulator/scene/environment end-to-end",
    "smoke: tests for core installation, task, and RL functionality",
    "kitless: test must pass inside the Kit-less container, which has no Isaac Sim runtime",
]

[tool.codespell]
skip = "*.usd,*.usda,*.usdc,*.json,*.onnx,*.pt,*.mp4,*.data,uv.lock,logs"

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false
